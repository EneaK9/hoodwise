[project]
name = "hoodwise"
version = "0.1.0"
description = "AI car-repair assistant grounded in factory service manuals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.25.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.6",
  "anthropic>=0.49.0",
  "openai>=1.60.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "argon2-cffi>=23.1.0",
  "httpx>=0.28.0",
  "pillow>=11.0.0",
  "imagehash>=4.3.2",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[project.scripts]
hoodwise-ingest = "ingestion.run_ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "app", "evals"]

[tool.pytest.ini_options]
testpaths = ["evals"]
pythonpath = ["."]
markers = ["integration: needs ingested Postgres data"]

[tool.ruff]
line-length = 100
target-version = "py311"
