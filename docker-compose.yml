services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hoodwise-postgres
    environment:
      POSTGRES_USER: hoodwise
      POSTGRES_PASSWORD: hoodwise
      POSTGRES_DB: hoodwise
    ports:
      - "5432:5432"
    volumes:
      - hoodwise_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoodwise -d hoodwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hoodwise_pgdata:
